# GreenBoost Gaming Suite , systemd-tmpfiles rule
#
# Group-scopes gaming_mode so GreenBoost Proton (running as the invoking
# user, not root) can write it. Applied at boot via systemd-tmpfiles-setup,
# and once immediately by install.sh , this specifically covers the case
# where greenboost.ko is already loaded before 99-greenboost-gaming.rules
# has a chance to fire (e.g. right after `sudo ./install.sh` on a machine
# where the module was loaded earlier in the session).
#
# Never world-writable (0666) , scoped to the 'greenboost' group only.
#
# Install to: /etc/tmpfiles.d/greenboost-gaming.conf

z /sys/module/greenboost/parameters/gaming_mode 0664 root greenboost -
