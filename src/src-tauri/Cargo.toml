[package]
name = "tauri-app"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: close-to-tray, so closing the window no longer kills a
# running session (Linux needs libayatana-appindicator3 at runtime; the
# tray is built best-effort and the Suite falls back to quit-on-close).
#
# Floor is 2.11, not just "2" , that's the first release pulling in
# muda >= 0.19. Confirmed live 2026-08-31: on tauri 2.10.x (muda 0.17.2),
# every tray menu item is built as a GtkMenuItem wrapping its label in a
# GtkBox instead of using GTK's own label property
# (muda-0.17.2 src/platform_impl/gtk/mod.rs create_gtk_item_for_menu_item);
# libdbusmenu can't read a label off an item with no label child (see
# libdbusmenu bug 1086563) and libayatana-appindicator exports it that way
# to GNOME, so the tray dropdown showed three blank rows , the labels
# build_tray() (main.rs) sets were always correct, this was a dependency
# bug. muda 0.19.3's create_gtk_item_for_menu_item builds a plain
# `gtk::MenuItem::builder().label(...)` instead. Don't let a future
# `cargo update` walk this back below 2.11.
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.0"
regex = "1.12.3"
tokio = "1.52.1"
glob = "0.3.3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
# PR-SSS: pkexec/sudo PATH lookup before privilege escalation.
which = "7"
# A1: dynamic NVML loading for GPU monitoring without nvidia-smi subprocess.
libloading = "0.8"

